<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base & Boost Chase - Select Language</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --accent-color: #d97706;
            --card-bg: #1e293b;
            --card-hover: #334155;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ネオンがまたたく背景演出 */
        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .language-options {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .lang-card {
            background-color: var(--card-bg);
            border: 2px solid #2e3e56;
            border-radius: 16px;
            width: 200px;
            padding: 30px 20px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .lang-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            background-color: var(--card-hover);
            box-shadow: 0 20px 25px -5px rgba(217, 119, 6, 0.15);
        }

        .flag {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .lang-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .lang-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="container">
        <h1>Base & Boost Chase</h1>
        <div class="subtitle">Select Your Language / 言語を選択してください</div>

        <div class="language-options">
            <!-- 日本語版へのリンク -->
            <a href="./ja/" class="lang-card">
                <span class="flag">🇯🇵</span>
                <span class="lang-title">日本語</span>
                <span class="lang-desc">ゲームを日本語でプレイ</span>
            </a>

            <!-- 英語版へのリンク -->
            <a href="./en/" class="lang-card">
                <span class="flag">🇺🇸</span>
                <span class="lang-title">English</span>
                <span class="lang-desc">Play in English</span>
            </a>
        </div>
    </div>

</body>
</html>
